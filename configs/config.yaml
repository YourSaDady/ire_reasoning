# arguments
task_name: binary-inversion  # binary-addition
param_type: mlp # transformer
max_len: 128
special_tokens: ['<mask>']
load_ebm_ckpts: False


# 这个参数暂时无用
models:
  llama3.1-8b-instruct:
    # regular tokens: [0-127999]
    # special indices: [128000, 128009]
    # special_tokens_map: {'bos_token': '<|begin_of_text|>', 'eos_token': '<|eot_id|>'}
    name: meta-llama/Llama-3.1-8B-Instruct

#all tasks
tasks:
  binary-addition:
    name: binary-addition
    inp_len: 12
    out_len: 10 #k
    num_classes: 2 #d #binary (exclude special tokens, eg. <mask>)
    train_size: 1800
    val_size: 200
    metrics: ['acc']

  binary-inversion:
    name: binary-inversion
    inp_len: 12
    out_len: 10 #k
    num_classes: 2 #d #binary (exclude special tokens, eg. <mask>)
    train_size: 1800
    val_size: 200
    metrics: ['acc']

  binary-subtraction:
    name: binary-subtraction
    inp_len: 12
    out_len: 10 #k
    num_classes: 2 #d #binary (exclude special tokens, eg. <mask>)
    train_size: 1800
    val_size: 200
    metrics: ['acc']

  # sudoku: 
  #   name: sudoku
  #   seq_len: 81 #9x9 ?
  #   vol: 9 #1~9 ?

  sudoku:
    name: sudoku
  #   inp_len: ? #<9x9?
  #   out_len: ?
    num_classes: 9 #1~9
  #   train_size: ?
  #   val_size: ?


train:
  stage: pretrain # sampling (inference) should be in the same stage
  epochs: 100
  lr: 1e-4
  early_stop_threshold: 0.5
  batch_size:  100 #100 #sudoku must be 1
  visualize: True
  wandb: True

sampling:
  batch_size: 10
  steps: 10
  temperature: 1.0

visualize:
  batch_step: 10 #visualize per <batch_step> number of batches
  time_step: 2 #the time step between consecutive screenshots 