task_name: countdown
param_type: gpt
is_ebm: false
load_ebm_ckpts: false
continue_train: false
device: cuda
models:
  llama3.1-8b-instruct:
    name: meta-llama/Llama-3.1-8B-Instruct
  bert:
    d_model: 384
    n_layers: 3
    heads: 12
  gpt:
    max_len: 50
    d_model: 384
    n_layers: 3
    heads: 12
    vocab_size: 31
tasks:
  binary-addition:
    name: binary-addition
    inp_len: 18
    out_len: 9
    num_classes: 3
    train_size: 1800
    val_size: 200
    metrics:
    - acc
  binary-inversion:
    name: binary-inversion
    inp_len: 12
    out_len: 10
    num_classes: 2
    train_size: 1800
    val_size: 200
    metrics:
    - acc
  binary-subtraction:
    name: binary-subtraction
    inp_len: 12
    out_len: 10
    num_classes: 2
    train_size: 1800
    val_size: 200
    metrics:
    - acc
  countdown:
    name: countdown
    metrics:
    - acc
    num_classes: 31
    max_len: 50
  sudoku:
    name: sudoku
    num_classes: 9
train:
  stage: inference
  epochs: 1
  lr: 0.0003
  early_stop_threshold: 0.01
  batch_size: 4
  visualize: true
  wandb: true
sampling:
  stage: inference
  batch_size: 1
  times: 10
  steps: 1
  sampler: argmin_energy
  wandb: false
visualize:
  batch_step: 10
  time_step: 2
