task_name: binary-addition
param_type: bert
load_ebm_ckpts: false
continue_train: false
models:
  llama3.1-8b-instruct:
    name: meta-llama/Llama-3.1-8B-Instruct
  bert:
    d_model: 32
    n_layers: 6
    heads: 8
tasks:
  binary-addition:
    name: binary-addition
    inp_len: 18
    out_len: 9
    num_classes: 3
    train_size: 1800
    val_size: 200
    metrics:
    - acc
  binary-inversion:
    name: binary-inversion
    inp_len: 12
    out_len: 10
    num_classes: 2
    train_size: 1800
    val_size: 200
    metrics:
    - acc
  binary-subtraction:
    name: binary-subtraction
    inp_len: 12
    out_len: 10
    num_classes: 2
    train_size: 1800
    val_size: 200
    metrics:
    - acc
  sudoku:
    name: sudoku
    num_classes: 9
train:
  stage: pretrain
  epochs: 1
  lr: 0.0001
  early_stop_threshold: 0.5
  batch_size: 4
  visualize: true
  wandb: true
sampling:
  stage: inference
  batch_size: 4
  times: 10
  steps: 1
  sampler: argmin_energy
  wandb: false
visualize:
  batch_step: 10
  time_step: 2
