task_name: binary-addition
param_type: mlp
special_tokens:
- <mask>
load_ebm_ckpts: false
models:
  llama3.1-8b-instruct:
    name: meta-llama/Llama-3.1-8B-Instruct
tasks:
  binary-addition:
    name: binary-addition
    inp_len: 12
    out_len: 10
    num_classes: 2
    train_size: 1800
    val_size: 200
    metrics:
    - acc
  binary-inversion:
    name: binary-inversion
    inp_len: 12
    out_len: 10
    num_classes: 2
    train_size: 1800
    val_size: 200
    metrics:
    - acc
  binary-subtraction:
    name: binary-subtraction
    inp_len: 12
    out_len: 10
    num_classes: 2
    train_size: 1800
    val_size: 200
    metrics:
    - acc
train:
  epochs: 100
  lr: 0.001
  early_stop_threshold: 0.3
  batch_size: 100
  visualize: true
  wandb: true
sampling:
  batch_size: 1
  steps: 10
  temperature: 1.0
visualize:
  batch_step: 10
  time_step: 2
